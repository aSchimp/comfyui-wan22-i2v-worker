name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      - name: Read version
        run: printf 'VERSION=%s\n' "$(cat VERSION)" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/aschimp/comfyui-wan22-i2v-worker:${{ env.VERSION }}
          build-args: IMAGE_VERSION=${{ env.VERSION }}
